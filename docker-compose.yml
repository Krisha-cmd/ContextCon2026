services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: revagent
      POSTGRES_PASSWORD: revagent
      POSTGRES_DB: revagent
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revagent -d revagent"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app_env
      DATABASE_URL: postgresql://revagent:revagent@postgres:5432/revagent
      CRUSTDATA_API_KEY: ${CRUSTDATA_API_KEY:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.runner.worker"]
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
