# All limits, windows, thresholds and output fields. No magic numbers in code.
# Secrets are NOT here: CRUSTDATA_API_KEY, GCP_PROJECT, REGISTRY_API_KEY, GSTIN_API_KEY, DATABASE_URL come from env.

limits:
  max_inr_per_job: 2500
  max_minutes_per_job: 20
  credit_inr: 25            # INR value of 1 Crustdata credit

windows:
  trigger_days: 30
  stale_buyer_months: 6

crustdata:
  rpm: 5                    # observed effective_rate_limit_rpm on search/enrich/identify
  timeout_s: 180            # web fetch was observed at 157 s
  batch_enrich: 5
  base_url: https://api.crustdata.com
  api_version: "2025-11-01"
  page_size:                # results per call (API max 1000; keep small)
    company_search: 10
    person_search: 5
    job_search: 10
  company_search_fields: [basic_info, headcount, funding, locations]
  company_search_sorts:     # stable order so cursors page without duplicates (probe test 2)
    - {field: crustdata_company_id, order: asc}
  enrich_fields: [basic_info, competitors, news, hiring, headcount, funding, people]
  job_search_sorts:
    - {field: metadata.date_added, order: desc}
  web_location: IN
  web_sources: [web]
  est_credits:              # used only for the budget guard when no X-Credits-Used header
    company_search_per_result: 0.53   # observed with headcount+funding+taxonomy premiums
    company_enrich_per_domain: 2.4    # 2 per record, twins bill too (observed 12 for 5)
    company_identify_per_input: 0.2
    person_search_per_result: 0.33    # observed with no fields (docs say 0.23)
    job_search_per_result: 0.03
    web_search_per_page: 1
    web_fetch_per_url: 1

# app/gateway. Endpoint names are "<group>:<name>", e.g. "crustdata:company/identify".
# Rate limiting uses one token bucket per endpoint. Its rpm is endpoint_rpm[endpoint] if set,
# else the group's rpm. A group's rpm/timeout_s come from its own section above
# (e.g. crustdata) when it has one, otherwise from the defaults here.
gateway:
  max_attempts: 4           # total tries, including the first
  backoff_base_s: 1.0       # attempt n waits base * 2^(n-1), capped, plus jitter
  backoff_max_s: 30
  backoff_jitter_s: 1.0
  bucket_capacity: 1        # token-bucket burst; 1 = strict 60/rpm spacing (Crustdata 429s on bursts)
  default_rpm: 60
  default_timeout_s: 30
  endpoint_rpm: {}          # e.g. {"crustdata:web/search": 10} (probe saw 10 rpm on web endpoints)

# Gemini on Vertex AI (app/gateway/vertex.py). Prices are list prices used only to ESTIMATE
# cost_ledger.inr from token counts; check them against the GCP price page before the demo.
vertex:
  model: gemini-3.8-flash        # verified 2026-11-22; 2.5-flash returns 404 for this project
  location: global
  temperature: 0
  thinking_budget: null          # Gemini 3.x: model default (2.5-era budget not sent)
  timeout_s: 60
  usd_per_m_input_tokens: 0.30    # PLACEHOLDER: 2.5-flash list price; update for 3.8-flash
  usd_per_m_output_tokens: 2.50   # thinking tokens bill as output
  inr_per_usd: 88
  est_inr_per_call: 1             # pre-call budget-guard estimate (actual cost logged after)

# GST registry (app/trust/registry.py). Gateway group "gstinapi": only 429 and 502 are
# retried, at most 3 attempts in total. A 200 costs 1 credit; errors cost nothing.
gstinapi:
  base_url: https://www.gstinapi.in
  rpm: 60
  timeout_s: 30
  max_attempts: 3
  retry_statuses: [429, 502]
  credit_inr: 1                 # PLACEHOLDER: set to your plan's INR price per lookup
  est_credits_per_lookup: 1
  include_profile: true         # same cost; adds business_constitution, jurisdiction, etc.

# app/trust/registry.py: which RegistryClient answers GST and MCA questions.
# Each is one of gstinapi | provider | fixture | unavailable. Env REGISTRY_PROVIDER, if set,
# overrides both. A real provider whose key/base URL is not in env becomes "unavailable".
# The "registry" runner step reads statuses with exact matching (case and spacing ignored);
# a status in neither list (Suspended, Dormant, Under Liquidation, ...) holds the account.
registry:
  gst_provider: gstinapi
  mca_provider: provider          # no MCA provider wired yet: unavailable until env is set
  fixture_dir: tests/fixtures/registry
  gst_active_statuses: [active]
  gst_drop_statuses: [cancelled]
  mca_active_statuses: [active]
  mca_drop_statuses: [strike off, struck off, dissolved, liquidated]

# ProviderRegistry (gateway group "registryapi"). Base URL and key come from env
# REGISTRY_BASE_URL / REGISTRY_API_KEY. PLACEHOLDER paths and prices until the provider's
# docs are in: the request/response mapping lives in one function per endpoint.
registryapi:
  rpm: 60
  timeout_s: 30
  max_attempts: 3
  retry_statuses: [429, 502, 503, 504]
  credit_inr: 1                   # PLACEHOLDER: INR per lookup
  est_credits_per_lookup: 1
  auth_header: x-api-key
  auth_prefix: ""                 # e.g. "Bearer " for Authorization headers
  paths:
    gst_search: /gst/search
    gst_lookup: /gst/{gstin}
    mca_lookup: /mca/companies

# app/trust/news.py: runner step "news" (adverse news). {name} is the legal name without its
# legal suffix (better recall); the relevance filter below decides what is about the company.
news:
  max_fetch: 5                    # pages fetched per account (search results + cached enrich news)
  query_template: '"{name}" (fraud OR insolvency OR NCLT OR raid OR "wilful defaulter" OR scam OR arrested OR penalty)'
  proximity_chars: 300            # a risk keyword must sit this close to the company name
  risk_keywords:                  # keyword -> category; matched as whole words, case ignored
    fraud: fraud
    scam: fraud
    arrested: fraud
    insolvency: insolvency
    nclt: insolvency
    wilful defaulter: insolvency
    raid: regulatory
    penalty: regulatory
  keyword_suffixes: [s, es, ed, ing, ulent]   # "raids", "raided", "fraudulent" also count
  legal_suffixes: [private limited, pvt. ltd., pvt ltd, pvt. ltd, limited, ltd., ltd, llp]
  date_meta_names: [article:published_time, datepublished, og:article:published_time,
                    publish-date, pubdate, date]
  min_article_chars: 200          # shorter <article> blocks fall back to the whole <body>
  use_llm: false                  # v2: Gemini labels articles that name the company
  llm_max_chars: 12000            # article text sent to the LLM is cut to this length
  hold_on_cannot_verify: true     # search failed -> hold (a wrong pass is worse than a hold)

# app/identity: company pages fetched for the legal name / CIN / GSTIN, in order.
# Fetching stops at the first page that yields a legal name or CIN.
identity:
  site_paths: ["", /privacy, /terms, /about, /contact]

cache_ttl_hours:
  registry: 24
  news: 24
  company: 168
  people: 168
  negative: 6

# app/identity/matcher.py + train.py. Bands: p >= match_threshold -> match,
# p <= nomatch_threshold -> no match, otherwise cannot_verify (held for a person).
# match_threshold is rewritten by `python -m app.identity.train`.
matching:
  match_threshold: 0.9
  nomatch_threshold: 0.5
  model_path: models/matcher.joblib
  training_csv: tests/golden/match_pairs.csv
  holdout_fraction: 0.25        # share of the hand-labelled pairs kept out for thresholding
  random_seed: 7
  calibration_cv: 5             # CalibratedClassifierCV folds (isotonic)
  max_iter: 1000                # LogisticRegression solver iterations
  synthetic_per_positive: 3     # perturbed negatives made from each training positive
  synthetic_token: Logistics    # token appended by the "add a word" perturbation

shortlist:
  pre_rank_top: 10
  enrich_top: 8

# app/discovery/doors.py. Filter field names follow the Crustdata filter grammar; the
# industry/state "(.)" (all words, any order) choice is unprobed: check it on the first live run.
discovery:
  default_max_accounts: 10        # when the RunSpec gives no max_accounts
  search_candidate_multiplier: 3  # door 1 stops at max_accounts * this many candidates...
  search_max_pages: 3             # ...or after this many pages
  company_filters:
    country_field: locations.country
    country_values: [India]
    industry_field: taxonomy.professional_network_industry
    industry_op: "(.)"
    state_field: locations.state
    state_op: "(.)"
    headcount_field: headcount.total
  job_title_field: job_details.title
  job_title_op: "(.)"
  job_title_keywords: [supply chain, logistics, warehouse]
  job_country_field: location.country
  job_country_value: India
  news_query_template: "{industry} new warehouse India"
  news_max_queries: 3             # one web search (+1 LLM extract) per industry, capped

# app/discovery/dedup.py
dedup:
  name_ratio: 95                  # rapidfuzz token_set_ratio for the (hold-only) name edge
  name_suffixes: [private limited, pvt ltd, pvt. ltd., limited, ltd, llp, inc, india]

# pre_rank step: cheap score from search fields, then score / est credits (greedy knapsack)
pre_rank:
  industry_ratio: 85              # token_set_ratio for a job listing's industry vs the spec
  weights:
    industry_fit: 1
    headcount_in_range: 1
    state_match: 1
    trigger_present: 1

output:
  fields: []

# Infrastructure settings (added with the skeleton so code has no magic numbers).
db:
  pool_min: 1
  pool_max: 10
  connect_timeout_s: 10
  schema_lock_key: 7300001  # pg_advisory_xact_lock key used while applying schema.sql

runner:
  poll_interval_s: 5
  lease_s: 60               # a claimed step is owned until now() + lease_s
  heartbeat_s: 20           # the heartbeat thread extends the lease this often
  max_attempts: 3           # then dead_letter (+ account held for per-account steps)
  retry_backoff_base_s: 5   # attempt n waits base * 2^(n-1), capped
  retry_backoff_max_s: 300
  # Skipped when the budget is exhausted or the job runs past max_minutes_per_job.
  # Downstream steps must treat their missing output as "cannot verify" (hold, not pass).
  optional_steps: [registry, news, enrich, trigger, buyer, draft]

log:
  level: INFO
