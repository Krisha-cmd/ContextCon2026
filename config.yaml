# All limits, windows, thresholds and output fields. No magic numbers in code.
# Secrets are NOT here: CRUSTDATA_API_KEY, GCP_PROJECT, REGISTRY_API_KEY, DATABASE_URL come from env.

limits:
  max_inr_per_job: 2500
  max_minutes_per_job: 20
  credit_inr: 25            # INR value of 1 Crustdata credit

windows:
  trigger_days: 30
  stale_buyer_months: 6

crustdata:
  rpm: 5                    # observed effective_rate_limit_rpm on search/enrich/identify
  timeout_s: 180            # web fetch was observed at 157 s
  batch_enrich: 5
  base_url: https://api.crustdata.com
  api_version: "2025-11-01"
  page_size:                # results per call (API max 1000; keep small)
    company_search: 10
    person_search: 5
    job_search: 10
  company_search_fields: [basic_info, headcount, funding, locations]
  company_search_sorts:     # stable order so cursors page without duplicates (probe test 2)
    - {field: crustdata_company_id, order: asc}
  enrich_fields: [basic_info, competitors, news, hiring, headcount, funding, people]
  job_search_sorts:
    - {field: metadata.date_added, order: desc}
  web_location: IN
  web_sources: [web]
  est_credits:              # used only for the budget guard when no X-Credits-Used header
    company_search_per_result: 0.53   # observed with headcount+funding+taxonomy premiums
    company_enrich_per_domain: 2.4    # 2 per record, twins bill too (observed 12 for 5)
    company_identify_per_input: 0.2
    person_search_per_result: 0.33    # observed with no fields (docs say 0.23)
    job_search_per_result: 0.03
    web_search_per_page: 1
    web_fetch_per_url: 1

# app/gateway. Endpoint names are "<group>:<name>", e.g. "crustdata:company/identify".
# Rate limiting uses one token bucket per endpoint. Its rpm is endpoint_rpm[endpoint] if set,
# else the group's rpm. A group's rpm/timeout_s come from its own section above
# (e.g. crustdata) when it has one, otherwise from the defaults here.
gateway:
  max_attempts: 4           # total tries, including the first
  backoff_base_s: 1.0       # attempt n waits base * 2^(n-1), capped, plus jitter
  backoff_max_s: 30
  backoff_jitter_s: 1.0
  bucket_capacity: 1        # token-bucket burst; 1 = strict 60/rpm spacing (Crustdata 429s on bursts)
  default_rpm: 60
  default_timeout_s: 30
  endpoint_rpm: {}          # e.g. {"crustdata:web/search": 10} (probe saw 10 rpm on web endpoints)

cache_ttl_hours:
  registry: 24
  news: 24
  company: 168
  people: 168
  negative: 6

matching:
  match_threshold: 0.9
  nomatch_threshold: 0.5

shortlist:
  pre_rank_top: 10
  enrich_top: 8

output:
  fields: []

# Infrastructure settings (added with the skeleton so code has no magic numbers).
db:
  pool_min: 1
  pool_max: 10
  connect_timeout_s: 10
  schema_lock_key: 7300001  # pg_advisory_xact_lock key used while applying schema.sql

runner:
  poll_interval_s: 5

log:
  level: INFO
