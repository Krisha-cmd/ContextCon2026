[project]
name = "revagent"
version = "0.1.0"
description = "Revenue-track agent for an Indian 3PL client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",     # ASGI server to run app.api.main:app
    "psycopg[binary,pool]>=3.2",   # pool extra -> psycopg_pool.ConnectionPool
    "pydantic>=2.9",
    "pydantic-settings>=2.6",      # env/.env override for secrets in Settings
    "pyyaml>=6.0",                 # parse config.yaml
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "scikit-learn>=1.5",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["API-research", "Ideation", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
